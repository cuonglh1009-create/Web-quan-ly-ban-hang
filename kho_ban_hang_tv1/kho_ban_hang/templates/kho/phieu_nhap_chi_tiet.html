{% extends "base.html" %}
{% block title %}Phiếu nhập {{ ma_phieu }}{% endblock %}
{% block content %}
<header class="page-head"><h1>Phiếu nhập {{ ma_phieu }}</h1></header>
<p class="notice" data-error hidden role="alert"></p>
<section class="panel" data-receipt="{{ ma_phieu }}">
  <p data-loading aria-live="polite">Đang tải phiếu…</p>
  <div data-details hidden>
    <dl class="details">
      <div><dt>Trạng thái</dt><dd><span class="badge" data-status></span></dd></div>
      <div><dt>Nhà cung cấp</dt><dd data-supplier></dd></div>
      <div><dt>Ngày nhập</dt><dd data-date></dd></div>
      <div><dt>Người lập</dt><dd data-employee></dd></div>
    </dl>
    <div class="table-wrap"><table>
      <thead><tr><th>Mã sản phẩm</th><th>Mã lô</th><th>Số lượng</th><th>Giá nhập (đ)</th><th>Ngày sản xuất</th><th>Hạn sử dụng</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <div class="actions"><button type="button" data-confirm hidden>Xác nhận nhập kho</button></div>
    <p data-feedback role="status" hidden></p>
  </div>
</section>
{% endblock %}
