{% extends "base.html" %}
{% block title %}Cảnh báo tồn kho{% endblock %}
{% block content %}
<header class="page-head"><h1>Cảnh báo tồn kho</h1></header>
<p class="notice" data-error hidden role="alert"></p>
<div class="alert-grid" data-alert-list>
  <section class="panel" id="ton-thap">
    <h2>Tồn thấp</h2>
    <ul data-low-list class="alert-list" aria-label="Sản phẩm dưới ngưỡng">
      <li>Đang tải cảnh báo…</li>
    </ul>
  </section>
  <section class="panel" id="sap-het-han">
    <h2>Sắp hết hạn</h2>
    <ul data-expiring-list class="alert-list" aria-label="Lô hàng sắp hết hạn">
      <li>Đang tải cảnh báo…</li>
    </ul>
  </section>
</div>
{% endblock %}
