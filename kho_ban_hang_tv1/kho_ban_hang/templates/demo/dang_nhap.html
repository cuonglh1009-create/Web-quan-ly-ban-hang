{% extends "base.html" %}
{% block title %}Đăng nhập kho{% endblock %}
{% block standalone %}
<section class="panel auth-card">
  <span class="brand-mark" aria-hidden="true">K</span>
  <h1>Đăng nhập kho</h1>
  {% if loi %}<p class="notice" role="alert">{{ loi }}</p>{% endif %}
  <form method="post" action="{{ url_for('dang_nhap') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Tên đăng nhập<input name="ten_dang_nhap" autocomplete="username" maxlength="64" required></label>
    <label>Mật khẩu<input name="mat_khau" type="password" autocomplete="current-password" required></label>
    <button type="submit">Đăng nhập</button>
  </form>
</section>
{% endblock %}
