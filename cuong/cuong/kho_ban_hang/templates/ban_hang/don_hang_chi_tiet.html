{% extends "base.html" %}
{% block title %}Đơn {{ ma_don }}{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ url_for('static', filename='ban_hang/ban_hang.css') }}">{% endblock %}
{% block content %}
<div id="trang" data-ma-don="{{ ma_don }}">
  <h1>Đơn <span id="ma-don"></span> <small id="trang-thai"></small></h1>
  <p id="loi" class="loi" role="alert" hidden></p>
  <section class="hop" id="tong-hop" hidden>
    <table>
      <tr><th>Tạm tính</th><td class="so" id="tam-tinh"></td></tr>
      <tr><th>Giảm theo hạng khách</th><td class="so" id="giam-khach"></td></tr>
      <tr><th>Giảm khuyến mại</th><td class="so" id="giam-km"></td></tr>
      <tr><th>Số phải trả</th><td class="so"><strong id="phai-tra"></strong></td></tr>
    </table>
  </section>

  <!-- Chỉ hiện theo trạng thái đơn (do don_chi_tiet.js bật/tắt) -->
  <section class="hop" id="khu-km" hidden>
    <h2>Mã khuyến mại</h2>
    <form id="form-km" novalidate>
      <label>Mã <input name="ma_km" autocomplete="off"><span class="loi-truong" data-loi-truong="ma_km"></span></label>
      <button type="submit">Áp dụng</button>
    </form>
  </section>

  <section class="hop" id="khu-thanh-toan" hidden>
    <h2>Thanh toán</h2>
    <form id="form-tt" novalidate>
      <label>Phương thức
        <select name="phuong_thuc">
          <option value="TIEN_MAT">Tiền mặt</option>
          <option value="CHUYEN_KHOAN">Chuyển khoản</option>
        </select></label>
      <div id="nhom-tien-mat">
        <label>Tiền khách đưa <input name="tien_khach_dua" inputmode="numeric">
          <span class="loi-truong" data-loi-truong="thong_tin.tien_khach_dua"></span></label>
      </div>
      <div id="nhom-chuyen-khoan" hidden>
        <label>Số tiền đối soát <input name="so_tien_doi_soat" inputmode="numeric">
          <span class="loi-truong" data-loi-truong="thong_tin.so_tien_doi_soat"></span></label>
        <label>Ngân hàng <input name="ten_ngan_hang">
          <span class="loi-truong" data-loi-truong="thong_tin.ten_ngan_hang"></span></label>
        <label>Mã giao dịch ngân hàng <input name="ma_giao_dich_ngan_hang">
          <span class="loi-truong" data-loi-truong="thong_tin.ma_giao_dich_ngan_hang"></span></label>
      </div>
      <button type="submit">Thanh toán và xuất hóa đơn</button>
    </form>
  </section>

  <div class="hang-nut">
    <a id="lien-ket-hoa-don" href="#" hidden><button type="button">Xem hóa đơn</button></a>
    <button type="button" id="nut-huy" class="nguy-hiem" hidden>Hủy đơn</button>
  </div>
</div>
{% endblock %}
{% block js %}<script src="{{ url_for('static', filename='ban_hang/don_chi_tiet.js') }}"></script>{% endblock %}
