<button class="secondary quick-jump" type="button" data-open-shortcuts aria-haspopup="dialog">Đi đến chức năng <kbd>Ctrl K</kbd></button>
<dialog class="jump-dialog" id="workspace-shortcuts" aria-labelledby="jump-title">
<div class="section-head"><h2 id="jump-title">Đi đến chức năng</h2><button class="secondary" type="button" data-close-shortcuts>Đóng</button></div>
<label for="jump-search">Tìm theo tên chức năng</label><input id="jump-search" type="search" placeholder="Ví dụ: sản phẩm, khách hàng…" autocomplete="off">
<nav data-jump-results aria-label="Kết quả tìm chức năng"></nav><p class="muted" data-jump-empty hidden>Không tìm thấy chức năng phù hợp.</p>
<p class="jump-help">Dùng Tab để chọn, Enter để mở và Esc để đóng.</p>
</dialog>
