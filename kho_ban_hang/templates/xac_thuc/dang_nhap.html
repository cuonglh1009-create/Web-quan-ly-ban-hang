{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<section class="hop hop-hep auth-card">
  <div class="auth-header">
    <span class="brand-mark" aria-hidden="true">K&amp;B</span>
    <h1>Đăng nhập</h1>
    <p class="muted">Hệ thống Kho &amp; Bán hàng</p>
  </div>
  <form id="form-dang-nhap" novalidate>
    <label>Tên đăng nhập <input name="ten_dang_nhap" autocomplete="username" placeholder="Nhập tên đăng nhập" required></label>
    <label>Mật khẩu <input name="mat_khau" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required></label>
    <p id="loi" class="loi" role="alert" hidden></p>
    <div style="margin-top: .75rem;">
      <button type="submit" class="button-block">Đăng nhập</button>
    </div>
  </form>
</section>
{% endblock %}
{% block js %}
<script>
  Api.khoiTao({}).then(() => {
    const form = document.getElementById("form-dang-nhap"), loi = document.getElementById("loi");
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      loi.hidden = true;
      try {
        const kq = await Api.post("/api/xac-thuc/dang-nhap", {
          ten_dang_nhap: form.ten_dang_nhap.value, mat_khau: form.mat_khau.value });
        location.href = kq.trang_chu;           // trình duyệt mở đúng trang theo vai trò
      } catch (e) {
        loi.textContent = e.thong_bao; loi.hidden = false;
        form.mat_khau.value = "";               // giữ tên đăng nhập, chỉ xóa mật khẩu
      }
    });
  });
</script>
{% endblock %}
