{% extends "base.html" %}
{% block title %}Bán hàng{% endblock %}
{% block content %}
<h1>Bán hàng</h1>
<section class="hop">
  <h2>Lập đơn mới</h2>
  <p>Nhập mã sản phẩm, số lượng và mã khách (nếu có); hệ thống giữ hàng ngay khi lập đơn.</p>
  <a href="/ban-hang/don-hang/moi"><button type="button">Lập đơn</button></a>
</section>
<section class="hop">
  <h2>Tra cứu đơn theo mã</h2>
  <form id="form-tra-cuu" novalidate>
    <label>Mã đơn <input name="ma_don" placeholder="DH000001" required></label>
    <p id="loi" class="loi" role="alert" hidden></p>
    <button type="submit">Mở đơn</button>
  </form>
</section>
{% endblock %}
{% block js %}
<script src="{{ url_for('static', filename='ban_hang/index.js') }}"></script>
{% endblock %}
